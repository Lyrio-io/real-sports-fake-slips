<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Look 1 — Kalshi Sport · Real Sports Fake Slips</title>
<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: #ffffff; color: #0a0a0a; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
body { min-height: 100vh; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; padding-bottom: 80px; }
button { font-family: inherit; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; background: none; border: none; color: inherit; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

/* Header */
.hdr { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 14px; border-bottom: 1px solid #f4f4f5; }
.hdr-left { display: flex; align-items: center; gap: 10px; }
.logo-mark { width: 30px; height: 30px; border-radius: 9px; background: #00b86b; color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 15px; }
.brand-name { font-size: 15px; font-weight: 800; line-height: 1.1; }
.brand-sub { font-size: 10px; color: #71717a; line-height: 1.1; margin-top: 1px; }
.hdr-right { display: flex; align-items: center; gap: 8px; }
.bankroll { padding: 7px 14px; border-radius: 999px; background: #fafafa; border: 1px solid #e4e4e7; font-size: 13px; font-weight: 700; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: #e4e4e7; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #525252; }

/* Category chips */
.chips { display: flex; gap: 8px; padding: 14px 20px 12px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; background: #f4f4f5; color: #52525b; flex-shrink: 0; }
.chip.active { background: #0a0a0a; color: #fff; }

/* Section header */
.sec-hdr { padding: 8px 20px 8px; display: flex; align-items: center; gap: 8px; }
.sec-hdr .label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
.sec-hdr .label.live { color: #ef4444; }
.sec-hdr .label.normal { color: #0a0a0a; }
.sec-hdr .count { font-size: 12px; color: #a1a1aa; font-weight: 500; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.15); animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

/* Card */
.card { margin: 0 20px 14px; background: #fff; border: 1px solid #e4e4e7; border-radius: 14px; padding: 16px; }
.card.featured { background: linear-gradient(135deg, #ecfdf5 0%, #ffffff 60%); border-color: #a7f3d0; }
.card-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-meta .league { font-size: 11px; font-weight: 700; color: #71717a; text-transform: uppercase; letter-spacing: 0.05em; }
.card-meta.feature .league { color: #047857; }
.team-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.team-row:last-of-type { margin-bottom: 16px; }
.team { display: flex; align-items: center; gap: 10px; }
.team-name { font-size: 15px; font-weight: 800; line-height: 1.15; }
.team-sub { font-size: 11px; color: #71717a; line-height: 1.15; margin-top: 1px; }
.team-score { font-size: 22px; font-weight: 800; }
.team-score.dim { color: #a1a1aa; }
.team-rec { font-size: 11px; color: #a1a1aa; font-weight: 600; }

/* Logo SVG sizing */
.logo { width: 36px; height: 36px; flex-shrink: 0; }
.logo.lg { width: 40px; height: 40px; }

/* Pick grid */
.pick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 6px; }
.pick-grid:last-child { margin-bottom: 0; }
.pick { padding: 8px 6px; text-align: center; border-radius: 10px; background: #fff; border: 1px solid #e4e4e7; transition: transform .12s, background .12s; }
.pick:active { transform: scale(0.96); background: #f9f9f9; }
.pick.yes { background: #00b86b; border-color: #00b86b; color: #fff; }
.pick .lbl { font-size: 10px; color: #71717a; line-height: 1.2; }
.pick.yes .lbl { color: rgba(255,255,255,.85); }
.pick .val { font-size: 13px; font-weight: 800; line-height: 1.2; margin-top: 1px; }
.pick .odds { font-size: 10px; color: #71717a; line-height: 1.2; margin-top: 1px; }
.pick.yes .odds { color: rgba(255,255,255,.85); }

/* Sparkline */
.spark { width: 50px; height: 18px; }
.spark path { fill: none; stroke: #00b86b; stroke-width: 1.5; }
.spark.down path { stroke: #ef4444; }

/* Bottom nav */
.nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e4e4e7; padding-bottom: max(18px, env(safe-area-inset-bottom, 18px)); z-index: 50; }
.nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 8px 0; }
.nav-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; position: relative; color: #a1a1aa; }
.nav-btn.active { color: #0a0a0a; }
.nav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
.nav-btn.active svg { stroke-width: 2.5; }
.nav-btn .lbl { font-size: 10px; font-weight: 700; }
.nav-btn.active .lbl { font-weight: 800; }
.nav-btn .badge { position: absolute; top: 2px; right: calc(50% - 16px); width: 16px; height: 16px; border-radius: 50%; background: #00b86b; color: #fff; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

/* Desktop phone frame */
@media (min-width: 500px) {
  body { background: #f5f5f5; display: flex; justify-content: center; padding: 24px 0 24px; }
  .phone { width: 390px; min-height: 844px; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.12); border-radius: 32px; overflow: hidden; position: relative; padding-bottom: 80px; }
  .nav { max-width: 390px; margin: 0 auto; }
}
</style>
</head>
